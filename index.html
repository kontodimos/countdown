<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adult Party</title>
<style>
body { font-family: 'Arial', sans-serif; margin: 0; background: radial-gradient(circle,#1a0b2e,#000); color:#f5e6ff; }
.nav {
background: #120720;
padding: 10px;
display: flex;
gap: 10px;
border-bottom: 1px solid #3a1f6b;
}
.nav button {
padding: 8px 12px;
border: none;
cursor: pointer;
border-radius: 5px;
background:#2a0f4f;
color:white;
}
.page { display: none; min-height: 90vh; }
.active { display: block; }


.center {
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:80vh;
text-align:center;
}


#countdown { font-size:28px; margin:20px; text-shadow:0 0 8px #c47aff; }


.btns { display:flex; gap:25px; margin-top:20px; }
.accept { background:#00a651; color:white; padding:14px 26px; font-size:18px; border:none; cursor:pointer; border-radius:8px; box-shadow:0 0 10px #00ff88; }
.reject { background:#d40000; color:white; padding:14px 26px; font-size:18px; border:none; cursor:pointer; border-radius:8px; box-shadow:0 0 10px #ff3333; }


/* 18+ modal */
#ageModal {
position:fixed; top:0; left:0; width:100%; height:100%;
background:rgba(0,0,0,0.9);
display:none; align-items:center; justify-content:center;
}
.age-box {
background:#120720; padding:30px; border-radius:12px; text-align:center; border:1px solid #5a2ca8;
}
.age-box button { margin:10px; padding:10px 18px; }


/* Ρεαλιστική πόρτα */
.door-container { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; }
.door-frame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
.door-frame img { width:260px; height:auto; transition:1.2s; transform-origin:left center; }
.door-frame img.open { transform:rotateY(70deg); }


.party-content { padding:40px; text-align:center; }
.party-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; max-width:900px; margin:auto; }
.card { background:#120720; padding:20px; border-radius:12px; border:1px solid #3a1f6b; }
</style>
</head>
<body>


<div class="nav">
<button onclick="goBack()">⬅ Back</button>
<button onclick="goForward()">Forward ➡</button>
<button onclick="goHome()">🏠 Home</button>
</div>


<div id="home" class="page active">
<div class="center">
<h1>🔥 ADULT PARTY 🔥</h1>
<p>Έναρξη: 10/02/2026 19:00</p>
<div id="countdown">Φόρτωση...</div>
<div class="btns">
<button class="accept" onclick="askAge()">ACCEPT</button>
<button class="reject" onclick="rejectParty()">REJECT</button>
</div>
</div>
</div>


<!-- 18+ Προειδοποίηση -->
<div id="ageModal">
<div class="age-box">
<h2>🔞 Είσαι 18+;</h2>
<p>Αυτό το περιεχόμενο προορίζεται μόνο για ενήλικες.</p>
<button class="accept" onclick="confirmAge()">ΝΑΙ</button>
<button class="reject" onclick="rejectParty()">ΟΧΙ</button>
</div>
</div>


<!-- Σελίδα Party -->
<div id="party" class="page">
<div class="party-content">
<h1>🎉 Καλώς ήρθες στο Party 🎉</h1>
</html>
